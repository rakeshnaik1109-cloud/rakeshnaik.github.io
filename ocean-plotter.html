<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocean Optics Raman Plotter</title>
<script src="./plotly-2.35.2.min.js"></script>

<style>
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface2: #f8fafc;
  --border: #cccccc;
  --accent: #0f172a;
  --accent2: #0f172a;
  --text: #000000;
  --muted: #444444;
  --danger: #dc2626;
  --radius: 10px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 0;
}

/* ===== INDEX STYLE NAVBAR ===== */

.navbar{
position:sticky;
top:0;
z-index:1000;

background:rgba(255,255,255,.88);

backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);

border-bottom:1px solid rgba(0,0,0,.08);

padding:16px 0;

margin-bottom:28px;

transition:.3s ease;
}

.nav-container{

max-width:1500px;

margin:auto;

padding:0 28px;

display:flex;

justify-content:space-between;

align-items:center;

}

.logo{

font-size:28px;

font-weight:800;

letter-spacing:-1px;

text-decoration:none;

color:#111827;

}

.logo span{

color:#2563eb;

font-weight:800;

}

.nav-links{

display:flex;

align-items:center;

gap:34px;

}

.nav-links a{

position:relative;

text-decoration:none;

font-size:15px;

font-weight:700;

color:#374151;

padding:6px 0;

transition:.25s;

}

.nav-links a:hover{

color:#2563eb;

}

.nav-links a.active{

color:#2563eb;

}

.nav-links a::after{

content:"";

position:absolute;

left:0;

bottom:-6px;

width:0;

height:2px;

background:#2563eb;

transition:.25s ease;

}

.nav-links a:hover::after,
.nav-links a.active::after{

width:100%;

}

@media(max-width:768px){

.nav-container{

flex-direction:column;

gap:12px;

}

.nav-links{

flex-wrap:wrap;

justify-content:center;

gap:18px;

}

}
.app-shell {
  max-width: 1500px;
  margin: auto;
  padding: 0 28px 28px 28px;
}

header.app-header {
  display: flex;
  justify-content: center;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 28px;
  padding-bottom: 20px;
}

header.app-header h1 {
  font-family: Arial, sans-serif;
  font-size: 36px;
  font-weight: bold;
  letter-spacing: 0;
  color: var(--text);
}

header.app-header span {
  font-size: 14px;
  color: var(--muted);
  letter-spacing: 0;
  text-transform: none;
}

.panel {
  background: var(--surface);
  border: none;
  border-radius: 0;
  padding: 0 0 22px 0;
  margin-bottom: 18px;
}

.panel-title {
  font-family: Arial, sans-serif;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 16px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 14px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field label {
  font-size: 14px;
  font-weight: bold;
  color: var(--text);
  letter-spacing: 0;
  text-transform: none;
}

.field input,
.field select {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: Arial, sans-serif;
  font-size: 14px;
  padding: 9px 11px;
  transition: border-color 0.15s;
  outline: none;
  width: 100%;
}

.field input:focus,
.field select:focus {
  border-color: var(--accent);
}

.field input[type="file"] {
  padding: 7px 11px;
  cursor: pointer;
}

.field input[type="color"] {
  padding: 4px 6px;
  height: 36px;
  cursor: pointer;
}

.toggles {
  display: flex;
  gap: 22px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.toggle-item {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
  color: var(--text);
  user-select: none;
}

.toggle-item input[type="checkbox"] {
  accent-color: var(--accent);
  width: 15px;
  height: 15px;
  cursor: pointer;
}

.actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 18px;
  align-items: center;
}

.download-group {
  display: flex;
  background: #0f172a;
  border-radius: 10px;
  overflow: hidden;
}

.download-group .btn {
  border-radius: 0;
}

.download-group select {
  background: #1e293b;
  color: #ffffff;
  border: none;
  font-family: Arial, sans-serif;
  font-size: 14px;
  font-weight: bold;
  padding: 0 12px;
  outline: none;
  cursor: pointer;
  border-left: 1px solid #334155;
}

.btn {
  font-family: Arial, sans-serif;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 0;
  text-transform: none;
  padding: 14px 30px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
}

.btn:active { transform: scale(0.97); }
.btn:hover { opacity: 0.85; }

.btn-primary {
  background: #0f172a;
  color: #ffffff;
}

.btn-secondary {
  background: #0f172a;
  color: #ffffff;
  border: none;
}

#status {
  font-size: 14px;
  color: var(--text);
  margin-top: 10px;
  min-height: 18px;
}

#status.ok { color: var(--text); }
#status.err { color: var(--danger); }

#spectrumControls {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

.spec-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 15px;
}

.spec-card b {
  font-family: Arial, sans-serif;
  font-size: 14px;
  font-weight: bold;
  color: var(--text);
  display: block;
  margin-bottom: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.spec-card .field {
  margin-bottom: 10px;
}

#plot-wrapper {
  background: white;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  display: block;
}

#plot-wrapper > div {
  display: block !important;
}

.modebar { background: transparent !important; }
.modebar-btn path { fill: #888 !important; }
</style>
</head>
<body>

<header class="navbar">
    <div class="nav-container">

        <a href="index.html" class="logo">
            Rakesh<span>Naik</span>
        </a>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#research">
                Research
            </a>

            <a href="index.html#publications">
                Publications
            </a>

            <a href="gallery.html">
                Gallery
            </a>
           <a href="ocean-plotter.html" class="active">
                Raman Plotter
            </a>

            <a href="blog.html">
                Blog
            </a>
           

        </nav>

    </div>
</header>

<div class="app-shell">

  <header class="app-header">
    <h1>Raman Plotter</h1>
    <span>Ocean Optics · Spectral Analysis</span>
  </header>

  <div class="panel">
    <div class="panel-title">Data Input</div>
    <div class="grid">
      <div class="field" style="grid-column: span 2;">
        <label>Upload .txt Files</label>
        <input type="file" id="fileInput" multiple accept=".txt">
      </div>
      <div class="field" style="grid-column: span 2;">
        <label>Plot Title</label>
        <input type="text" id="title" value="Average Spectrum">
      </div>
    </div>
    <div id="status">No files loaded</div>
  </div>

  <div class="panel">
    <div class="panel-title">Plot Settings</div>
    <div class="grid">
      <div class="field">
        <label>X Min (cm⁻¹)</label>
        <input type="number" id="xmin" value="400">
      </div>
      <div class="field">
        <label>X Max (cm⁻¹)</label>
        <input type="number" id="xmax" value="1800">
      </div>
      <div class="field">
        <label>Normalization</label>
        <select id="normType">
          <option value="none">None</option>
          <option value="max">Max</option>
          <option value="minmax">Min-Max</option>
          <option value="area">Area</option>
          <option value="vector">Vector</option>
        </select>
      </div>
      <div class="field">
        <label>Line Width</label>
        <input type="number" id="linewidth" value="2" min="0.5" step="0.5">
      </div>
      <div class="field">
        <label>Figure Width (px)</label>
        <input type="number" id="figWidth" value="1000" min="300" step="50">
      </div>
      <div class="field">
        <label>Figure Height (px)</label>
        <input type="number" id="figHeight" value="600" min="200" step="50">
      </div>
      <div class="field">
        <label>Title Size</label>
        <input type="number" id="titleSize" value="22" min="8">
      </div>
      <div class="field">
        <label>Axis Label Size</label>
        <input type="number" id="labelSize" value="18" min="8">
      </div>
      <div class="field">
        <label>Tick Size</label>
        <input type="number" id="tickSize" value="13" min="6">
      </div>
      <div class="field">
        <label>Legend Size</label>
        <input type="number" id="legendSize" value="12" min="6">
      </div>
      <div class="field">
        <label>Average Line Color</label>
        <input type="color" id="avgColor" value="#0f172a">
      </div>
    </div>

    <div class="toggles">
      <label class="toggle-item">
        <input type="checkbox" id="showPeaks" checked>
        Detect Peaks
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="boldStyle" checked>
        Bold Font
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="averageOnly">
        Show Average Spectrum Only
      </label>
    </div>
  </div>

  <div id="spectraPanel" style="display:none; margin-bottom: 18px;">
    <div id="spectrumControls"></div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="plotSpectrum()">▶ Plot</button>
    <div class="download-group">
      <button class="btn btn-secondary" onclick="downloadPlot()">↓ Download Image</button>
      <select id="downloadFormat">
        <option value="png">.png</option>
        <option value="jpeg">.jpg</option>
        <option value="tiff">.tiff</option>
      </select>
    </div>
  </div>

  <div id="plot-wrapper"></div>

</div>

<script>
let spectra = [];

document.getElementById("fileInput").addEventListener("change", readFiles);

/* ── File reading ──────────────────────────────────────────── */
function readFiles(e) {
  spectra = [];
  document.getElementById("spectrumControls").innerHTML = "";
  document.getElementById("spectraPanel").style.display = "none";

  const files = Array.from(e.target.files);
  if (!files.length) return;

  let loaded = 0;
  files.forEach((file, index) => {
    const reader = new FileReader();
    reader.onload = evt => {
      parseOceanData(evt.target.result, file.name, index);
      loaded++;
      setStatus(`${loaded} / ${files.length} spectra loaded`, loaded === files.length ? "ok" : "");
      if (loaded === files.length) {
        document.getElementById("spectraPanel").style.display = "block";
      }
    };
    reader.readAsText(file);
  });
}

function parseOceanData(text, filename, index) {
  const x = [], y = [];
  let start = false;

  for (const line of text.split("\n")) {
    if (line.includes(">>>>>Begin Spectral Data<<<<<")) { start = true; continue; }
    if (start) {
      const vals = line.trim().split(/[\s,\t]+/);
      if (vals.length >= 2) {
        const xx = parseFloat(vals[0]);
        const yy = parseFloat(vals[1]);
        if (!isNaN(xx) && !isNaN(yy)) { x.push(xx); y.push(yy); }
      }
    }
  }

  const palette = ["#5ee7c8","#a78bfa","#f87171","#fbbf24","#60a5fa","#34d399","#fb923c","#e879f9"];
  const color = palette[index % palette.length];

  spectra[index] = { x, y };

  document.getElementById("spectrumControls").innerHTML += `
    <div class="spec-card">
      <b title="${filename}">${filename}</b>
      <div class="field">
        <label>Label</label>
        <input id="label${index}" value="${filename.replace(/\.txt$/i, "")}">
      </div>
      <div class="field">
        <label>Color</label>
        <input type="color" id="color${index}" value="${color}">
      </div>
    </div>`;
}

/* ── Normalization ─────────────────────────────────────────── */
function normalizeData(y, type) {
  if (type === "none") return y;
  if (type === "max") {
    const m = Math.max(...y); return m ? y.map(v => v / m) : y;
  }
  if (type === "minmax") {
    const mn = Math.min(...y), mx = Math.max(...y);
    return (mx - mn) ? y.map(v => (v - mn) / (mx - mn)) : y;
  }
  if (type === "area") {
    const s = y.reduce((a, b) => a + Math.abs(b), 0);
    return s ? y.map(v => v / s) : y;
  }
  if (type === "vector") {
    const norm = Math.sqrt(y.reduce((a, b) => a + b * b, 0));
    return norm ? y.map(v => v / norm) : y;
  }
  return y;
}

/* ── Linear Interpolation Helper for Averaging ─────────────── */
function interpolate(xArr, yArr, targetX) {
  if (targetX <= xArr[0]) return yArr[0];
  if (targetX >= xArr[xArr.length - 1]) return yArr[yArr.length - 1];
  
  let low = 0, high = xArr.length - 1;
  while (high - low > 1) {
    const mid = Math.floor((low + high) / 2);
    if (xArr[mid] <= targetX) low = mid;
    else high = mid;
  }
  const x0 = xArr[low], x1 = xArr[high];
  const y0 = yArr[low], y1 = yArr[high];
  return y0 + (targetX - x0) * (y1 - y0) / (x1 - x0);
}

/* ── Peak detection ────────────────────────────────────────── */
function detectPeaks(xx, yy) {
  const threshold = 0.2 * Math.max(...yy);
  const peaks = [];
  for (let i = 1; i < yy.length - 1; i++) {
    if (yy[i] > yy[i - 1] && yy[i] > yy[i + 1] && yy[i] > threshold) peaks.push(i);
  }
  return peaks;
}

/* ── Status helper ─────────────────────────────────────────── */
function setStatus(msg, cls = "") {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = cls;
}

/* ── Main plot function ────────────────────────────────────── */
function plotSpectrum() {
  if (!spectra.length) { alert("Please upload at least one spectrum file first."); return; }

  const bold       = document.getElementById("boldStyle").checked;
  const peaks      = document.getElementById("showPeaks").checked;
  const avgOnly    = document.getElementById("averageOnly").checked;
  const xmin       = parseFloat(document.getElementById("xmin").value);
  const xmax       = parseFloat(document.getElementById("xmax").value);
  const lw         = parseFloat(document.getElementById("linewidth").value);
  const norm       = document.getElementById("normType").value;
  const titleText  = document.getElementById("title").value;
  const titleSize  = parseInt(document.getElementById("titleSize").value);
  const labelSize  = parseInt(document.getElementById("labelSize").value);
  const tickSize   = parseInt(document.getElementById("tickSize").value);
  const legSize    = parseInt(document.getElementById("legendSize").value);
  const chosenAvgColor = document.getElementById("avgColor").value;

  const W = Math.max(300, parseInt(document.getElementById("figWidth").value)  || 1000);
  const H = Math.max(200, parseInt(document.getElementById("figHeight").value) || 600);

  const font = bold ? "Arial Black, Arial" : "Georgia, serif";

  const wrapper = document.getElementById("plot-wrapper");
  wrapper.style.width  = W + "px";
  wrapper.style.height = H + "px";

  Plotly.purge(wrapper);
  const traces = [];

  if (avgOnly) {
    const baseSpec = spectra[0];
    const baseMask = baseSpec.x.map((v, i) => v >= xmin && v <= xmax ? i : -1).filter(i => i >= 0);
    if (!baseMask.length) { alert("No spectral values found within your X range limit."); return; }
    
    const sharedX = baseMask.map(i => baseSpec.x[i]);
    const sumY = new Array(sharedX.length).fill(0);

    spectra.forEach((spec) => {
      const mask = spec.x.map((v, i) => v >= xmin && v <= xmax ? i : -1).filter(i => i >= 0);
      const subX = mask.map(i => spec.x[i]);
      let subY = mask.map(i => spec.y[i]);
      subY = normalizeData(subY, norm);

      sharedX.forEach((targetX, idx) => {
        sumY[idx] += interpolate(subX, subY, targetX);
      });
    });

    const avgY = sumY.map(val => val / spectra.length);

    traces.push({
      x: sharedX, y: avgY,
      mode: "lines",
      line: { width: lw, color: chosenAvgColor }, // Uses chosen color picker setting
      name: "Calculated Average"
    });

    if (peaks && avgY.length > 2) {
      const pi = detectPeaks(sharedX, avgY);
      if (pi.length) {
        traces.push({
          x: pi.map(i => sharedX[i]),
          y: pi.map(i => avgY[i]),
          mode: "markers+text",
          marker: { color: chosenAvgColor, size: 5, symbol: "circle" },
          text: pi.map(i => String(Math.round(sharedX[i]))),
          textposition: "top center",
          textfont: { family: font, size: 9, color: "#333" },
          showlegend: false,
          hoverinfo: "skip"
        });
      }
    }
  } else {
    spectra.forEach((spec, idx) => {
      const mask = spec.x.map((v, i) => v >= xmin && v <= xmax ? i : -1).filter(i => i >= 0);
      const xx = mask.map(i => spec.x[i]);
      let   yy = mask.map(i => spec.y[i]);

      yy = normalizeData(yy, norm);

      const color = document.getElementById("color" + idx)?.value ?? "#5ee7c8";
      const label = document.getElementById("label" + idx)?.value ?? `Spectrum ${idx + 1}`;

      traces.push({
        x: xx, y: yy,
        mode: "lines",
        line: { width: lw, color },
        name: label
      });

      if (peaks && yy.length > 2) {
        const pi = detectPeaks(xx, yy);
        if (pi.length) {
          traces.push({
            x: pi.map(i => xx[i]),
            y: pi.map(i => yy[i]),
            mode: "markers+text",
            marker: { color, size: 5, symbol: "circle" },
            text: pi.map(i => String(Math.round(xx[i]))),
            textposition: "top center",
            textfont: { family: font, size: 9, color: "#333" },
            showlegend: false,
            hoverinfo: "skip"
          });
        }
      }
    });
  }

  const layout = {
    width:  W,
    height: H,
    autosize: false,
    title: { text: titleText, font: { size: titleSize, family: font, color: "#111" } },
    plot_bgcolor:  "white",
    paper_bgcolor: "white",
    margin: { l: 70, r: 30, t: 60, b: 70 },
    xaxis: {
      title: { text: "Raman Shift (cm\u207B\u00B9)", font: { size: labelSize, family: font } },
      tickfont: { size: tickSize, family: font },
      showline: true, linewidth: 2, mirror: true,
      showgrid: true, gridcolor: "#e5e7eb",
      range: [xmin, xmax]
    },
    yaxis: {
      title: { text: "Intensity (a.u.)", font: { size: labelSize, family: font } },
      tickfont: { size: tickSize, family: font },
      showline: true, linewidth: 2, mirror: true,
      showgrid: true, gridcolor: "#e5e7eb"
    },
    legend: {
      x: 0.98, y: 0.98,
      xanchor: "right", yanchor: "top",
      bgcolor: "rgba(255,255,255,0.9)",
      bordercolor: "#aaa", borderwidth: 1,
      font: { size: legSize, family: font }
    }
  };

  Plotly.newPlot(wrapper, traces, layout, {
    responsive: false,
    displaylogo: false,
    modeBarButtonsToRemove: ["lasso2d", "select2d"]
  });
}

/* ── Dynamic Export Download Engine ────────────────────────── */
function downloadPlot() {
  const format = document.getElementById("downloadFormat").value;
  const W = parseInt(document.getElementById("figWidth").value)  || 1000;
  const H = parseInt(document.getElementById("figHeight").value) || 600;
  
  Plotly.downloadImage("plot-wrapper", {
    format: format === "tiff" ? "png" : format, 
    filename: "RamanPlot",
    width: W,
    height: H,
    scale: 3
  });
}
</script>
