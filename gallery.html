<body>

<header class="navbar">
    <div class="nav-container">
        <div class="logo">Rakesh<span>Naik</span></div>
        
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#research">Research</a>

            <a href="gallery.html" class="active">Gallery</a>
            <a href="blog.html">Blog</a>
            
        </nav>
    </div>
</header>

<main class="container">
    <section id="gallery">
        <div class="section-header">
            <div>
                <h1>Visual Gallery</h1>
                <p class="subtitle">Capturing moments from our research and lab milestones.</p>
            </div>
            <a href="index.html" class="back-home">← Back to Home</a>
        </div>

        <div class="gallery-grid">
            <div class="gallery-item">
                <div class="img-wrapper">
                    <img src="Photos/AR_group_bsd.jpg" alt="Convocation Ceremony" loading="lazy">
                </div>
                <p>Convocation Ceremony — Dr. Riya & Dr. Arti</p>
            </div>

            <div class="gallery-item">
                <div class="img-wrapper">
                    <img src="Photos/Ajay Ghatak.JPG" alt="World Quantum Day" loading="lazy">
                </div>
                <p>World Quantum Day Celebration</p>
            </div>

            <div class="gallery-item">
                <div class="img-wrapper">
                    <img src="Photos/FBG Demonstration.JPG" alt="FBG demonstration" loading="lazy">
                </div>
                <p>FBG Demonstration</p>
            </div>

            <div class="gallery-item">
                <div class="img-wrapper">
                    <img src="Photos/GroupPoster.JPG" alt="Research poster" loading="lazy">
                </div>
                <p>Research Group Poster</p>
            </div>
            </div>
        </div>
    </section>
</main>

<div id="imageModal" class="modal">
    <span class="close">&times;</span>
    <span class="nav-btn prev">&#10094;</span>
